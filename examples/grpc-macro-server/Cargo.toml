[package]
name = "grpc-macro-server"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
by-grpc = { path = "../../packages/by-grpc" }
by-macros = { path = "../../packages/by-macros" }
prost = "0.13"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net"] }
tonic = "0.12"

[dev-dependencies]
prost-types = "0.13"
tokio-stream = { version = "0.1", features = ["net"] }

[build-dependencies]
prost-build = "0.13"
protoc-bin-vendored = "3"
tonic-build = "0.12"
