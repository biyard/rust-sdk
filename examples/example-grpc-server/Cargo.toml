[package]
name = "example-grpc-server"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
by-grpc = { path = "../../packages/by-grpc" }
prost = "0.14"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = "0.14"
tonic-prost = "0.14"

[dev-dependencies]
prost-types = "0.14"

[build-dependencies]
protoc-bin-vendored = "3"
tonic-prost-build = "0.14"
