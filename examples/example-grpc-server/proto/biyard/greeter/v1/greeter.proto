syntax = "proto3";

package biyard.greeter.v1;

service Greeter {
  rpc SayHello(HelloRequest) returns (HelloReply);
  rpc WhoAmI(WhoAmIRequest) returns (WhoAmIReply);
}

message HelloRequest {
  string name = 1;
}

message HelloReply {
  string message = 1;
}

message WhoAmIRequest {}

message WhoAmIReply {
  string user_id = 1;
  optional string workspace_id = 2;
}
